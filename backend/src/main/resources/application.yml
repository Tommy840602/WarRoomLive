server:
  port: 8080

spring:
  application:
    name: warroomlive-backend
  # Default profile keeps chat in memory. spring-boot-starter-data-jpa is on the
  # classpath (for the postgres profile), so its DataSource/JPA auto-config must be
  # disabled here to avoid a startup failure with no database. The 'postgres' profile
  # clears this list.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

warroomlive:
  signaling:
    # Comma-separated list of allowed origins for the WebSocket handshake.
    # "*" is convenient for local development; lock this down per environment.
    allowed-origins: "*"
    # Hard cap on participants per room. The client uses a full WebRTC mesh, whose
    # upload bandwidth scales with peer count, so keep this small until an SFU exists.
    max-room-size: 8
    # Abuse limits for the signaling plane, mirroring the ones the collab service
    # has always had. Rate is per connection and tolerates a burst of twice this
    # (a join followed by a flurry of ICE candidates); messages beyond it are
    # dropped, not fatal to the connection. Frames larger than the cap are
    # refused by the container — an SDP offer, the largest legitimate message,
    # is a few kilobytes.
    max-messages-per-second: 60
    max-frame-bytes: 65536
  api:
    # Per-caller limit for the HTTP API, keyed by client address (the last entry
    # of X-Forwarded-For, which is the one nginx added). Tolerates a burst of
    # twice this, so a page load fetching several endpoints at once is never
    # throttled; excess gets 429 with Retry-After. Health, the auth bootstrap and
    # the self-authenticating LiveKit webhook are exempt.
    max-requests-per-second: ${API_MAX_REQUESTS_PER_SECOND:20}
  attachments:
    # Files shared into a room. Uploads and downloads go straight between the
    # browser and the object store through presigned URLs under this prefix (see
    # the /objects/ location in nginx.conf), so no file byte passes through this
    # server. Requires the same object store as recordings; without it the
    # endpoints 404. The cap is enforced twice — before signing, against what the
    # caller declares, and at confirmation, against what actually landed.
    public-prefix: ${ATTACHMENT_PATH_PREFIX:/objects}
    max-bytes: ${ATTACHMENT_MAX_BYTES:26214400}
  chat:
    # How many recent messages to retain per room (in-memory) and replay on join.
    history-limit: 100
    # Chat is the one signaling payload that reaches durable storage, so its
    # length is bounded here; over-long messages are rejected, never truncated.
    max-length: 4000
  # Media plane. Unset (default) = full-mesh WebRTC in the browser. Setting all
  # three (see docker-compose.sfu.yml) switches /api/media/config to SFU mode and
  # enables the LiveKit token endpoint.
  media:
    livekit-url: ${LIVEKIT_URL:}
    livekit-api-key: ${LIVEKIT_API_KEY:}
    livekit-api-secret: ${LIVEKIT_API_SECRET:}
    # ICE servers handed to mesh-mode browsers. TURN kicks in when all three
    # TURN_* variables are set (see docker-compose.turn.yml).
    stun-urls: ${STUN_URLS:stun:stun.l.google.com:19302}
    turn-urls: ${TURN_URLS:}
    turn-username: ${TURN_USERNAME:}
    turn-password: ${TURN_PASSWORD:}
    # Recording (docker-compose.recording.yml): where THIS server reaches LiveKit's
    # twirp API, and the S3 output egress uploads finished MP4s to.
    livekit-internal-url: ${LIVEKIT_INTERNAL_URL:}
    egress-s3-endpoint: ${EGRESS_S3_ENDPOINT:}
    egress-s3-bucket: ${EGRESS_S3_BUCKET:}
    egress-s3-access-key: ${EGRESS_S3_ACCESS_KEY:}
    egress-s3-secret-key: ${EGRESS_S3_SECRET_KEY:}
  # How long durable data is kept, in days (postgres profile). ZERO MEANS FOREVER
  # — the deliberate default, so deploying this release deletes nothing until an
  # operator chooses a period. Recordings remove their object from the store as
  # well; chat covers its search projection too, so search can never return a
  # message that no longer exists. Published outbox rows are the short-term
  # audit trail behind the backbone; unpublished ones are the queue and are
  # never touched.
  retention:
    recordings-days: ${RETENTION_RECORDINGS_DAYS:0}
    chat-days: ${RETENTION_CHAT_DAYS:0}
    audit-days: ${RETENTION_AUDIT_DAYS:0}
    published-events-days: ${RETENTION_PUBLISHED_EVENTS_DAYS:0}
    attachments-days: ${RETENTION_ATTACHMENTS_DAYS:0}
    # The to-do list and the calendar share one period: they are one thing to
    # the people using them, and keeping tasks whose meetings have gone leaves a
    # list nobody can place.
    agenda-days: ${RETENTION_AGENDA_DAYS:0}
    interval-ms: ${RETENTION_INTERVAL_MS:3600000}
    initial-delay-ms: ${RETENTION_INITIAL_DELAY_MS:60000}

# Metrics/health for scraping. nginx does not proxy /actuator, so these stay
# internal to the compose network (the observability overlay's Prometheus).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # OTLP tracing is opt-in (observability overlay sets TRACING_ENABLED=true and
  # points the endpoint at Tempo); disabled it costs nothing.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    redis:
      # The Redis starter is on the classpath for the 'redis' profile; without that
      # profile no Redis exists, so keep it out of the health verdict (the redis
      # profile switches this back on).
      enabled: false

logging:
  level:
    com.warroomlive: INFO
