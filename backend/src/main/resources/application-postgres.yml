# Durable chat persistence. Activate with: SPRING_PROFILES_ACTIVE=postgres
# Provide the datasource via environment variables (see defaults below).
spring:
  # Re-enable the JPA/DataSource auto-config that the default profile excludes.
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/warroomlive}
    username: ${DB_USER:warroomlive}
    password: ${DB_PASSWORD:warroomlive}
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Existing databases predate Flyway (Hibernate-created tables, no history
    # table): baseline them at 0 so V1+ apply/verify cleanly.
    baseline-on-migrate: true
    baseline-version: 0
