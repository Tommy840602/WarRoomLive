# TLS edge overlay — opt-in on top of docker-compose.yml.
#
# Local test (Caddy internal CA, self-signed):
#   HTTP_PORT=8081 HTTPS_PORT=8443 docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build
#   then open https://localhost:8443  (browser will warn about the local CA)
#
# Production (real domain, automatic Let's Encrypt on ports 80/443):
#   SITE_ADDRESS=warroom.example.com \
#     docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
services:
  # The edge terminates TLS; the frontend is no longer published directly.
  # !override replaces the base 'ports' list instead of merging with it.
  frontend:
    ports: !override []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
