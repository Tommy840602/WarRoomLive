# Opt-in observability overlay: Prometheus scraping the backend
# (/actuator/prometheus) and collab (/metrics) services, plus Grafana with the
# datasource pre-provisioned (anonymous admin — local/dev use).
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#   Prometheus: http://localhost:9090   Grafana: http://localhost:3000
#
# Composes with the other overlays (oidc, tls, sfu) — metrics endpoints are open
# at the Spring/collab layer but never proxied by nginx, so they remain
# unreachable from outside the compose network either way.
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
      - collab

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infrastructure/observability/tempo.yml:/etc/tempo.yml:ro

  # Notification routing for the alert rules (grouping, inhibition, receivers).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  # Dev-only webhook receiver: logs every notification so delivery is
  # verifiable (`docker compose logs alert-logger`). Production replaces the
  # receivers in alertmanager.yml — this container then has no traffic.
  alert-logger:
    image: node:20-alpine
    command:
      - node
      - -e
      - |
        require('http').createServer((req, res) => {
          let body = ''
          req.on('data', (c) => (body += c))
          req.on('end', () => {
            try {
              const n = JSON.parse(body)
              n.alerts?.forEach((a) => console.log(
                'ALERT', a.status, a.labels.alertname,
                'severity=' + a.labels.severity, 'job=' + (a.labels.job ?? '-')))
            } catch { console.log('ALERT raw', body) }
            res.end('ok')
          })
        }).listen(9095, () => console.log('alert-logger listening on :9095'))

  backend:
    environment:
      TRACING_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infrastructure/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infrastructure/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/warroomlive.yml:ro
      - ./infrastructure/observability/dashboard-warroomlive.json:/var/lib/grafana/dashboards/warroomlive.json:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
