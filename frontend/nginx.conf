# Preserve the original scheme when an upstream TLS proxy (Caddy overlay) already
# set X-Forwarded-Proto; otherwise report our own.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: serve index.html for client-side routes.
    location / {
        try_files $uri /index.html;
    }

    # REST API → backend. Request-time DNS (like /auth) so multiple backend
    # replicas (scale overlay) are round-robined by docker's DNS.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OIDC provider (oidc overlay only) → identity provider under the same origin.
    # The variable defers DNS to request time so the base stack (no IdP service)
    # still starts; without the overlay these requests simply fail.
    location /auth/ {
        resolver 127.0.0.11 valid=10s;
        set $idp_upstream http://devidp:8089;
        proxy_pass $idp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Recording playback (recording overlay only). The backend hands the browser
    # a presigned URL under this prefix; the signature covers the object store's
    # own host and path, so the prefix is stripped and Host is rewritten to match
    # — otherwise the store recomputes a different signature and refuses. The
    # bytes stream straight from the store; they never pass through the backend.
    location /recordings/ {
        resolver 127.0.0.11 valid=10s;
        set $objects_upstream http://minio:9000;
        # proxy_pass with a variable does not apply nginx's URI-replacement rule,
        # so the prefix is stripped explicitly — the signature covers the path.
        rewrite ^/recordings/(.*)$ /$1 break;
        proxy_pass $objects_upstream;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    # LiveKit SFU signaling (sfu overlay only). Same request-time DNS trick as
    # /auth; the /livekit prefix is stripped because LiveKit serves /rtc at root.
    location /livekit/ {
        resolver 127.0.0.11 valid=10s;
        set $livekit_upstream http://livekit:7880;
        rewrite ^/livekit(/.*)$ $1 break;
        proxy_pass $livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Yjs document sync → collab service (longest-prefix match beats /ws/).
    location /ws/doc {
        resolver 127.0.0.11 valid=10s;
        set $collab_upstream http://collab:1234;
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # WebSocket signaling → backend, with the upgrade handshake headers.
    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $signal_upstream http://backend:8080;
        proxy_pass $signal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
