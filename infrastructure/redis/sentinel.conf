# Sentinel config for the HA overlay (copied to a writable path at container
# start — Sentinel rewrites its config file). Hostname mode so docker DNS names
# work across failovers. Quorum 2 of 3 sentinels; ~5s down detection.
port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor warroom redis 6379 2
sentinel down-after-milliseconds warroom 5000
sentinel failover-timeout warroom 15000
sentinel parallel-syncs warroom 1
