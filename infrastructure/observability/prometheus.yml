# Scrape config for the observability overlay. All metrics endpoints are
# internal to the compose network — nginx does not proxy them.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']

  - job_name: collab
    metrics_path: /metrics
    static_configs:
      - targets: ['collab:1234']

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: ['indexer:9400']

  # WebRTC quality metrics; up only when the sfu overlay runs alongside.
  - job_name: livekit
    metrics_path: /metrics
    static_configs:
      - targets: ['livekit:6789']
