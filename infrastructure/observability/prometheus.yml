# Scrape config for the observability overlay. Both metrics endpoints are
# internal to the compose network — nginx does not proxy them.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']

  - job_name: collab
    metrics_path: /metrics
    static_configs:
      - targets: ['collab:1234']
