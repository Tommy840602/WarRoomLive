# LiveKit SFU config for the recording overlay: same as livekit.yaml plus the
# Redis bus (how the SFU hands work to the egress service) and webhooks (how
# recording completion reaches the backend). Mounted over /etc/livekit.yaml by
# docker-compose.recording.yml.
port: 7880
prometheus_port: 6789
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
# Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in the compose files.
keys:
  devkey: devkey_secret_needs_at_least_32_bytes
redis:
  address: redis:6379
webhook:
  urls:
    - http://backend:8080/api/livekit/webhook
  api_key: devkey
logging:
  level: info
