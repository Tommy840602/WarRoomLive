# LiveKit Egress worker config (recording overlay). Storage credentials ride in
# each StartEgress request from the backend, not here.
redis:
  address: redis:6379
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET are injected by Compose. Keeping secrets
# out of this file lets production use the same image and checked-in config.
ws_url: ws://livekit:7880
insecure: true
log_level: info
