# Trust the reverse proxy in front of this one, and only it.
#
# Included at http level (nginx.conf's conf.d include lives inside http), so it
# applies to every server block. Mounted only by docker-compose.prod.yml, where
# the frontend is bound to loopback and an edge proxy is the sole possible peer.
#
# Why it matters: the backend rate-limits per caller using the LAST entry of
# X-Forwarded-For, because that is the one this nginx appended and therefore the
# only one a client cannot forge. Add an edge proxy in front and that last entry
# becomes the EDGE's address for every request — one bucket for the whole
# internet, so one person's burst returns 429 to everybody.
#
# With real_ip, $remote_addr is rewritten to the client the edge reported, and
# the header this nginx appends therefore ends with the browser again.
#
# The default trusts the loopback and RFC1918 ranges, which is what an edge on
# the same host or in a sibling Docker network will present as. If the edge is
# somewhere else, replace these with its address — a range wider than the edge
# is a range in which someone else can forge the header.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from ::1/128;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

real_ip_header X-Forwarded-For;

# Walk back past trusted hops to the first address that is not one of ours, so
# a chain of two proxies still resolves to the browser rather than to a proxy.
real_ip_recursive on;
