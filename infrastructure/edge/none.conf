# Deliberately empty.
#
# The frontend always mounts something at 00-real-ip.conf, because a single
# compose file cannot add a mount conditionally. This is what it mounts when the
# stack is NOT behind a trusted edge: nginx then treats the peer address as the
# client, which is correct when its own port is the public one.
#
# `./stack.sh up prod` swaps in real-ip.conf, which tells nginx to believe the
# edge's X-Forwarded-For. That belief is only safe behind an edge — mounted on a
# publicly published port it would let any caller claim any address, and the
# backend's per-caller rate limit reads that header.
