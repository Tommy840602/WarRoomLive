# Site block for an existing nginx edge that already serves other hosts on this
# machine. Use this instead of the Caddyfile in this directory — one or the
# other, whichever is already terminating TLS for twin.tommy-huang.dev.
#
#   cp live.tommy-huang.dev.nginx.conf /etc/nginx/sites-available/live.tommy-huang.dev
#   ln -s ../sites-available/live.tommy-huang.dev /etc/nginx/sites-enabled/
#   certbot --nginx -d live.tommy-huang.dev      # or however this host issues certs
#   nginx -t && systemctl reload nginx
#
# WARROOM_PORT must match docker-compose.prod.yml (default 8088). The stack
# binds it to loopback, so this proxy is the only way in.
#
# ON A HOST WITHOUT IPv6, delete the two `listen [::]` lines. nginx cannot
# conditionally bind: it fails with "Address family not supported by protocol"
# and refuses to start — and `nginx -t` does not catch this, because it never
# binds. So the sequence is test-passes, reload-fails, and every other site on
# the machine goes down with it. Check first: `ip -6 addr show scope global`.

server {
    listen 80;
    listen [::]:80;
    server_name live.tommy-huang.dev;

    # getUserMedia only works on HTTPS, so plaintext is never a usable fallback
    # here — send it up rather than serving a version of the app whose camera
    # will not start.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name live.tommy-huang.dev;

    # Certificate paths — certbot rewrites these itself if you let it manage
    # the file; otherwise point them at the existing certificate for this host.
    ssl_certificate     /etc/letsencrypt/live/live.tommy-huang.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.tommy-huang.dev/privkey.pem;

    # A presigned PUT carries the whole file through here; the backend refuses
    # anything larger, so this only has to not be the stricter of the two.
    client_max_body_size 64m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:8088;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The app's own nginx reads this and appends the real client, so the
        # backend's per-caller rate limit sees the browser rather than this
        # proxy. See infrastructure/edge/real-ip.conf.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Signaling and document sync are WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A meeting's socket is idle between messages for long stretches; the
        # default 60s would drop people mid-call. Uploads and recording
        # playback also stream, so buffering is off.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# If the existing nginx.conf does not already define it, add this map at http
# level — "Connection: upgrade" must only be sent for requests that asked for
# an upgrade, or ordinary responses break.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
